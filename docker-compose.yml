# Full local stack: app + Postgres + Redis. For the observability stack
# (Grafana, Tempo, Loki, Prometheus, OTel Collector) additionally run:
#   docker compose -f infra/observability/docker-compose.yml up -d
services:
  voice-agent:
    build:
      context: .
      dockerfile: apps/voice-agent/Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost:8080}
      SIMULATION: ${SIMULATION:-true}
      PERSISTENCE: ${PERSISTENCE:-postgres}
      DATABASE_URL: postgres://voice_agent:voice_agent@postgres:5432/voice_agent
      REDIS_URL: redis://redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4318}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      CALCOM_API_KEY: ${CALCOM_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: voice_agent
      POSTGRES_PASSWORD: voice_agent
      POSTGRES_DB: voice_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voice_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
